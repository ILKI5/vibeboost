    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(226, 232, 240, 0.8);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.5; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Волны на фоне */
        .bg-waves {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .wave {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .wave-1 { width: 600px; height: 600px; background: rgba(99, 102, 241, 0.2); top: -200px; left: -100px; }
        .wave-2 { width: 500px; height: 500px; background: rgba(168, 85, 247, 0.15); bottom: -100px; right: -100px; animation-delay: -5s; }
        .wave-3 { width: 400px; height: 400px; background: rgba(56, 189, 248, 0.15); top: 40%; left: 40%; animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* Шапка */
        header { padding: 40px 0 20px; text-align: center; }
        .logo { 
            font-size: 42px; font-weight: 800; letter-spacing: -1px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            cursor: pointer;
        }
        .status {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 14px; font-weight: 500; color: var(--text-muted);
            margin-top: 8px;
        }
        .pulse-dot {
            width: 10px; height: 10px; background: #22c55e; border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Основной контент */
        #app { padding: 20px 0 60px; min-height: 60vh; }
        
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

        /* Карточки */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .card-icon {
            width: 48px; height: 48px; border-radius: 12px; object-fit: contain;
            background: white; padding: 6px; box-shadow: var(--shadow-sm);
        }
        .card-info { flex: 1; }
        .card-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .card-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .card-arrow { color: var(--text-muted); width: 20px; height: 20px; }

        /* Кнопка Назад */
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px;
            background: white; border: 1px solid var(--border-color);
            padding: 10px 16px; border-radius: 100px; font-weight: 600; font-size: 14px;
            color: var(--text-main); cursor: pointer; margin-bottom: 24px;
            transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .btn-back:hover { background: var(--bg-color); border-color: var(--primary); color: var(--primary); }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 24px; padding: 32px;
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
            animation: modalIn 0.3s ease; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        @keyframes modalIn { from { transform: scale(0.95) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 28px; color: var(--text-muted); cursor: pointer; line-height: 1; }
        .close-btn:hover { color: var(--text-main); }
        
        .modal h2 { font-size: 22px; font-weight: 700; margin-bottom: 20px; padding-right: 30px; }
        
        .info-block { margin-bottom: 16px; }
        .info-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .info-value { font-size: 15px; font-weight: 500; }
        .info-desc { font-size: 13px; color: var(--text-muted); background: var(--bg-color); padding: 12px; border-radius: 8px; margin-top: 8px; line-height: 1.4; white-space: pre-wrap; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .form-group label span { color: var(--text-muted); font-weight: 400; font-size: 12px; }
        .form-control {
            width: 100%; padding: 12px 16px; border: 2px solid var(--border-color);
            border-radius: 12px; font-size: 15px; transition: var(--transition); outline: none;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .form-control.invalid { border-color: #ef4444; }
        
        .price-total {
            background: var(--primary-gradient); color: white;
            padding: 16px; border-radius: 12px; display: flex; justify-content: space-between;
            align-items: center; font-size: 18px; font-weight: 700; margin: 24px 0;
        }
        
        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: var(--transition);
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #0f172a; color: white; padding: 12px 24px; border-radius: 100px;
            font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 2000;
            box-shadow: var(--shadow-lg); pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ef4444; }

        .hidden { display: none !important; }
    </style>

const app = document.getElementById('app');
const modal = document.getElementById('orderModal');
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('ru-RU', {
    maximumFractionDigits: 7
});
const networkName = s => s.network || 'Без указанной соцсети';
let selected = null;
let previousFocus = null;
let toastTimer;

function node(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
}

function screen(title, back) {
    app.replaceChildren();
    if (back) {
        const button = node('button', '← Назад', 'btn-back');
        button.type = 'button';
        button.onclick = back;
        app.append(button);
    }
    app.append(node('h2', title, 'section-title'));
    const grid = node('div', undefined, 'grid');
    app.append(grid);
    return grid;
}

function card(title, subtitle, action, network) {
    const button = node('button', undefined, 'card');
    button.type = 'button';

    if (network) {
        const icon = node('span', undefined, 'network-icon');
        const fallback = node('span', network.slice(0, 2).toUpperCase());
        const image = new Image();
        image.alt = '';
        image.hidden = true;
        image.onload = () => {
            image.hidden = false;
            fallback.hidden = true;
        };
        image.onerror = () => image.remove();
        image.src = encodeURIComponent(network) + '.png';
        icon.append(fallback, image);
        button.append(icon);
    }

    const info = node('span', undefined, 'card-info');
    info.append(
        node('span', title, 'card-title'),
        node('span', subtitle, 'card-subtitle')
    );
    button.append(info, node('span', '›', 'card-arrow'));
    button.onclick = action;
    return {button, info};
}

function renderNetworks() {
    const grid = screen('Выберите соц. сеть');
    const networks = [...new Set(SERVICES.map(networkName))]
        .sort((a, b) => a.localeCompare(b, 'ru'));

    for (const network of networks) {
        const count = SERVICES.filter(s => networkName(s) === network).length;
        grid.append(card(
            network,
            `Доступно услуг: ${count}`,
            () => renderCategories(network),
            network
        ).button);
    }
}

function renderCategories(network) {
    const grid = screen(
        network + ': выберите категорию',
        renderNetworks
    );
    const scope = SERVICES.filter(s => networkName(s) === network);
    const categories = [...new Set(scope.map(s => s.category))]
        .sort((a, b) => a.localeCompare(b, 'ru'));

    for (const category of categories) {
        const count = scope.filter(s => s.category === category).length;
        grid.append(card(
            category,
            `Доступно услуг: ${count}`,
            () => renderServices(network, category)
        ).button);
    }
}

function renderServices(network, category) {
    const grid = screen(category, () => renderCategories(network));
    app.insertBefore(node(
        'p',
        '*цена за 1000 штук, в валюте аккаунта поставщика',
        'price-note'
    ), grid);

    for (const service of SERVICES.filter(s =>
        networkName(s) === network && s.category === category
    )) {
        const item = card(
            service.name,
            `ID ${service.service} · Мин: ${fmt(service.min)} | Макс: ${fmt(service.max)}`,
            () => openOrderModal(service.service)
        );
        item.info.append(node(
            'span',
            `${fmt(service.rate)} / 1000 шт.`,
            'service-price'
        ));
        grid.append(item.button);
    }
}

function openOrderModal(id) {
    selected = SERVICES.find(s => s.service === id);
    if (!selected) return;
    previousFocus = document.activeElement;

    $('modalNetwork').textContent = networkName(selected);
    $('modalCategory').textContent = selected.category;
    $('modalService').textContent = selected.name;
    $('modalDescription').textContent =
        (selected.description || 'Описание не предоставлено.') +
        '\n\nРефилл: ' + (selected.refill ? 'доступен' : 'не предусмотрен');
    $('descBlock').classList.remove('hidden');

    const quantity = $('orderQuantity');
    quantity.min = selected.min;
    quantity.max = selected.max;
    quantity.step = 1;
    quantity.value = selected.min;
    quantity.readOnly = Number(selected.min) === Number(selected.max);

    $('modalLimits').textContent =
        `Мин: ${fmt(selected.min)} | Макс: ${fmt(selected.max)}`;
    $('orderLink').value = '';
    $('orderLink').setCustomValidity('');
    $('orderLink').placeholder =
        /@username|юзернейм/i.test(selected.description || '')
        ? '@username или https://…' : 'https://…';

    updatePrice();
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    $('orderLink').focus();
}

function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
    selected = null;
    previousFocus?.focus();
}

function updatePrice() {
    if (!selected) return;
    const input = $('orderQuantity');
    const quantity = Number(input.value);
    const valid = /^\d+$/.test(input.value) &&
        Number.isSafeInteger(quantity) &&
        quantity >= Number(selected.min) &&
        quantity <= Number(selected.max);

    input.setCustomValidity(valid ? '' :
        `Введите целое число от ${selected.min} до ${selected.max}.`);
    input.classList.toggle('invalid', !valid);
    $('submitBtn').disabled = !valid;
    $('modalTotalPrice').textContent = valid
        ? fmt(Number(selected.rate) * quantity / 1000)
        : '—';
}

function submitOrder(event) {
    event.preventDefault();
    if (!selected) return;
    updatePrice();

    const input = $('orderLink');
    const link = input.value.trim();
    let valid = false;

    if (selected.network === 'Telegram' &&
        /@username|юзернейм/i.test(selected.description || '') &&
        /^@[a-zA-Z][a-zA-Z0-9_]{3,31}$/.test(link)) {
        valid = true;
    } else {
        try {
            const base = selected.network === 'WEB - Трафик'
                ? link.split(/[\s<]/)[0] : link;
            const url = new URL(base);
            valid = ['http:', 'https:'].includes(url.protocol) &&
                !!url.hostname && !url.username && !url.password &&
                !/\s/.test(base);
        } catch {}
    }

    input.setCustomValidity(valid ? '' :
        'Укажите полную http(s)-ссылку или разрешённый для услуги @username.');
    if (!$('orderForm').reportValidity()) return;

    const quantity = Number($('orderQuantity').value);
    const draft = {
        status: 'draft_not_sent',
        service: selected.service,
        name: selected.name,
        network: selected.network,
        category: selected.category,
        link,
        quantity,
        rate_per_1000: selected.rate,
        total: Number((Number(selected.rate) * quantity / 1000).toFixed(7)),
        currency: 'account_currency'
    };

    const url = URL.createObjectURL(new Blob(
        [JSON.stringify(draft, null, 2)],
        {type: 'application/json;charset=utf-8'}
    ));
    const anchor = node('a');
    anchor.href = url;
    anchor.download = `Vibeboost-заявка-${selected.service}.json`;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    $('toast').textContent = 'Заявка подготовлена. Поставщику не отправлена.';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}

function resetToHome() {
    if (selected) closeModal();
    renderNetworks();
}

document.addEventListener('keydown', event => {
    if (!modal.classList.contains('active')) return;
    if (event.key === 'Escape') closeModal();
    if (event.key === 'Tab') {
        const focusable = [...modal.querySelectorAll(
            'button:not(:disabled), input:not(:disabled), a[href]'
        )].filter(e => e.getClientRects().length);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }
});

logo.setAttribute('role', 'button');
logo.tabIndex = 0;
logo.addEventListener('keydown', event => {

<script id="vb-final-script">
(()=>{
 const money=n=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
 const originalServices=renderServices;
 renderServices=function(network,category){
   originalServices(network,category);
   const list=SERVICES.filter(s=>networkName(s)===network && s.category===category);
   document.querySelectorAll('#app .service-price').forEach((el,i)=>{if(list[i])el.textContent=money(list[i].rate)+' / 1000 шт.'});
   document.querySelectorAll('#app .price-note').forEach(el=>el.textContent='Цена за 1000 шт. в рублях. Итог округляется до копеек.');
 };
 const previousCard=card;
 card=function(title,subtitle,action,network){
   if(network){const scope=SERVICES.filter(s=>networkName(s)===network);if(scope.length)subtitle='Услуг: '+scope.length+' · от '+money(Math.min(...scope.map(s=>Number(s.rate))))+' / 1000';}
   return previousCard(title,subtitle,action,network);
 };
 const originalUpdate=updatePrice;
 updatePrice=function(){originalUpdate();if(selected && $('orderQuantity').validity.valid && $('orderQuantity').value!=='')$('modalTotalPrice').textContent=money(Number(selected.rate)*Number($('orderQuantity').value)/1000)};
 // Старый обработчик input был привязан к старой функции. Этот обновляет отображение последним.
 $('orderQuantity').addEventListener('input',()=>updatePrice());
 const originalOpen=openOrderModal;
 openOrderModal=function(id){
   originalOpen(id);
   $('vb-telegram-panel')?.remove();
   $('submitBtn').textContent='Отправить заявку';
   updatePrice();
 };
 document.querySelectorAll('#orderForm > .price-note').forEach(el=>{
   if(el.id!=='specialTypeNote')el.textContent='Заявка будет подготовлена для Telegram. Скопируйте текст и отправьте его боту. Оплата здесь не производится.';
 });
 $('submitBtn').textContent='Отправить заявку';
 submitOrder=async function(event){
   event.preventDefault();
   if(!selected)return;
   updatePrice();
   const input=$('orderLink');const link=input.value.trim();let valid=false;
   if(selected.network==='Telegram' && /@username|юзернейм/i.test(selected.description||'') && /^@[a-zA-Z][a-zA-Z0-9_]{3,31}$/.test(link))valid=true;
   else {try{const url=new URL(link);valid=['http:','https:'].includes(url.protocol)&&!!url.hostname&&!url.username&&!url.password&&!/\s/.test(link)}catch{}}
   input.setCustomValidity(valid?'':'Укажите корректную ссылку или разрешённый для услуги @username.');
   if(!$('orderForm').reportValidity())return;
   let bot;
   try{bot=new URL(window.TELEGRAM_BOT_URL);if(bot.protocol!=='https:' || bot.hostname!=='t.me' || !/^\/[a-zA-Z0-9_]+$/.test(bot.pathname) || bot.pathname==='/YOUR_BOT' || bot.username || bot.password)throw Error();}
   catch{alert('Укажите ссылку на своего Telegram-бота в переменной TELEGRAM_BOT_URL в начале HTML.');return;}
   const quantity=Number($('orderQuantity').value);
   const draft={status:'draft_not_sent',service:selected.service,name:selected.name,network:selected.network,category:selected.category,link,quantity,rate_per_1000:Number(selected.rate).toFixed(2),total:(Number(selected.rate)*quantity/1000).toFixed(2),currency:'RUB'};
   const message='Заявка VibeBoost\n'+JSON.stringify(draft,null,2);
   $('vb-telegram-panel')?.remove();
   const panel=document.createElement('section');panel.id='vb-telegram-panel';
   const note=document.createElement('p');note.className='price-note';note.textContent='Скопируйте заявку и отправьте её в чат бота. Если бот запускается впервые, сначала нажмите «Начать».';
   const area=document.createElement('textarea');area.id='vb-message';area.readOnly=true;area.value=message;area.setAttribute('aria-label','Текст заявки для Telegram');
   const copy=document.createElement('button');copy.type='button';copy.className='btn-submit';copy.textContent='Скопировать заявку';
   async function copyMessage(){try{await navigator.clipboard.writeText(message);note.textContent='Заявка скопирована. Откройте бота, вставьте текст и отправьте сообщение.';return true}catch{area.focus();area.select();note.textContent='Выделенный текст скопируйте вручную и отправьте боту.';return false}}
   copy.onclick=copyMessage;
   const open=document.createElement('a');open.href=bot.href;open.target='_blank';open.rel='noopener noreferrer';open.textContent='Открыть Telegram-бота ↗';
   panel.append(note,area,copy,open);$('orderForm').append(panel);
   // Открываем окно синхронно по клику, до await, чтобы браузер не блокировал его.
   window.open(bot.href,'_blank','noopener,noreferrer');
   await copyMessage();
 };
 renderNetworks();
})();
</script>


<script id="vb-ready-message-patch">
// URL не проверяем и не требуем: отправляется введённое пользователем значение.
const vbLinkInput = document.getElementById('orderLink');
if (vbLinkInput) {
  vbLinkInput.removeAttribute('required');
  vbLinkInput.required = false;
}
window.submitOrder = function(event) {
  event.preventDefault();
  if (!selected) return;

  const quantityInput = document.getElementById('orderQuantity');
  const quantityText = quantityInput.value.trim();
  const quantity = Number(quantityText);
  const quantityValid = /^\d+$/.test(quantityText) && Number.isSafeInteger(quantity) &&
    quantity >= Number(selected.min) && quantity <= Number(selected.max);
  if (!quantityValid) {
    quantityInput.setCustomValidity(`Введите целое число от ${selected.min} до ${selected.max}.`);
    quantityInput.reportValidity();
    return;
  }
  quantityInput.setCustomValidity('');

  const link = document.getElementById('orderLink').value.trim();
  const total = Number((Number(selected.rate) * quantity / 1000).toFixed(2));
  const draft = {
    status: 'draft_not_sent',
    service: selected.service,
    name: selected.name,
    network: selected.network,
    category: selected.category,
    link: link,
    quantity: quantity,
    rate_per_1000: Number(selected.rate).toFixed(2),
    total: total.toFixed(2),
    currency: 'RUB'
  };
  const message = 'Заявка VibeBoost\n' + JSON.stringify(draft, null, 2);
  const shareUrl = 'https://t.me/share/url?url=&text=' + encodeURIComponent(message);

  // Telegram открывает выбор чата с готовым текстом. Пользователь выбирает своего бота
  // и нажимает «Отправить»; браузер не может отправить сообщение без действия пользователя.
  const a = document.createElement('a');
  a.href = shareUrl;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.style.display = 'none';
  document.body.append(a);
  a.click();
  a.remove();
  const toast = document.getElementById('toast');
  if (toast) {
    toast.textContent = 'Заявка подготовлена в Telegram. Выберите чат бота и нажмите «Отправить».';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 5000);
  }
};
// Ссылка оставлена как настройка/контакт, но для share-окна не передаётся,
// чтобы ссылка на бота не добавлялась в текст заявки.
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(() => {
  const API_BASE = 'https://vibeboost-2.onrender.com/';

  const tg = window.Telegram?.WebApp || null;
  const app = document.getElementById('app');
  const modal = document.getElementById('orderModal');
  const form = document.getElementById('orderForm');
  const quantityInput = document.getElementById('orderQuantity');
  const linkInput = document.getElementById('orderLink');
  const submitButton = document.getElementById('submitBtn');
  const toastElement = document.getElementById('toast');

  let currentScreen = 'networks';
  let currentNetwork = null;
  let currentCategory = null;
  let selectedService = null;
  let toastTimer;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const money = value =>
    `${Number(value).toLocaleString('ru-RU', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    })} ₽`;

  const number = value =>
    Number(value).toLocaleString('ru-RU');

  function showToast(message, error = false) {
    toastElement.textContent = message;
    toastElement.classList.toggle('error', error);
    toastElement.classList.add('show');

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastElement.classList.remove('show');
    }, 4500);
  }

  function makeElement(tag, text, className) {
    const element = document.createElement(tag);

    if (text !== undefined) {
      element.textContent = text;
    }

    if (className) {
      element.className = className;
    }

    return element;
  }

  function makeCard(title, subtitle, callback, network) {
    const button = makeElement('button', undefined, 'card');
    button.type = 'button';
    button.addEventListener('click', callback);

    if (network) {
      const icon = makeElement(
        'span',
        network.slice(0, 2).toUpperCase(),
        'network-icon'
      );
      button.appendChild(icon);
    }

    const info = makeElement('span', undefined, 'card-info');
    info.append(
      makeElement('span', title, 'card-title'),
      makeElement('span', subtitle, 'card-subtitle')
    );

    button.append(
      info,
      makeElement('span', '›', 'card-arrow')
    );

    return { button, info };
  }

  function createScreen(title, backCallback) {
    app.replaceChildren();

    if (backCallback) {
      const back = makeElement('button', '← Назад', 'btn-back');
      back.type = 'button';
      back.addEventListener('click', backCallback);
      app.appendChild(back);
    }

    app.appendChild(makeElement('h2', title, 'section-title'));

    const tools = makeElement('div', undefined, 'catalog-tools');
    const search = makeElement('input', undefined, 'catalog-search');

    search.type = 'search';
    search.placeholder = 'Поиск по каталогу…';
    search.setAttribute('aria-label', 'Поиск по каталогу');

    const counter = makeElement('span', undefined, 'catalog-counter');

    tools.append(search, counter);
    app.appendChild(tools);

    const grid = makeElement('div', undefined, 'grid');
    app.appendChild(grid);

    return { search, counter, grid };
  }

  function showEmpty(grid, text = 'Ничего не найдено.') {
    grid.replaceChildren(
      makeElement('div', text, 'empty-state')
    );
  }

  function renderNetworks() {
    currentScreen = 'networks';
    currentNetwork = null;
    currentCategory = null;

    const { search, counter, grid } =
      createScreen('Выберите соц. сеть');

    const networks = [...new Set(SERVICES.map(s => s.network || 'Без сети'))]
      .sort((a, b) => a.localeCompare(b, 'ru'));

    function draw() {
      const query = search.value.trim().toLowerCase();

      const filtered = networks.filter(network =>
        network.toLowerCase().includes(query)
      );

      counter.textContent =
        `${filtered.length} площадок · ${SERVICES.length} услуг`;

      grid.replaceChildren();

      if (!filtered.length) {
        showEmpty(grid);
        return;
      }

      filtered.forEach(network => {
        const services = SERVICES.filter(
          service => (service.network || 'Без сети') === network
        );

        grid.appendChild(
          makeCard(
            network,
            `Услуг: ${services.length}`,
            () => renderCategories(network),
            network
          ).button
        );
      });
    }

    search.addEventListener('input', draw);
    draw();
  }

  function renderCategories(network) {
    currentScreen = 'categories';
    currentNetwork = network;
    currentCategory = null;

    const { search, counter, grid } = createScreen(
      `${network}: выберите категорию`,
      renderNetworks
    );

    const services = SERVICES.filter(
      service => service.network === network
    );

    const categories = [...new Set(
      services.map(service => service.category)
    )].sort((a, b) => a.localeCompare(b, 'ru'));

    function draw() {
      const query = search.value.trim().toLowerCase();

      const filtered = categories.filter(category =>
        category.toLowerCase().includes(query)
      );

      counter.textContent = `${filtered.length} категорий`;
      grid.replaceChildren();

      if (!filtered.length) {
        showEmpty(grid);
        return;
      }

      filtered.forEach(category => {
        const count = services.filter(
          service => service.category === category
        ).length;

        grid.appendChild(
          makeCard(
            category,
            `Услуг: ${count}`,
            () => renderServices(network, category)
          ).button
        );
      });
    }

    search.addEventListener('input', draw);
    draw();
  }

  function renderServices(network, category) {
    currentScreen = 'services';
    currentNetwork = network;
    currentCategory = category;

    const { search, counter, grid } = createScreen(
      category,
      () => renderCategories(network)
    );

    const services = SERVICES.filter(service =>
      service.network === network &&
      service.category === category
    );

    function draw() {
      const query = search.value.trim().toLowerCase();

      const filtered = services.filter(service =>
        `${service.name} ${service.service}`
          .toLowerCase()
          .includes(query)
      );

      counter.textContent = `${filtered.length} услуг`;
      grid.replaceChildren();

      if (!filtered.length) {
        showEmpty(grid);
        return;
      }

      filtered.forEach(service => {
        const item = makeCard(
          service.name,
          `ID ${service.service} · Мин: ${number(service.min)} · Макс: ${number(service.max)}`,
          () => openOrderModal(service.service)
        );

        item.info.appendChild(
          makeElement(
            'span',
            `${money(service.rate)} / 1000 шт.`,
            'service-price'
          )
        );

        grid.appendChild(item.button);
      });
    }

    search.addEventListener('input', draw);
    draw();
  }

  function updatePrice() {
    if (!selectedService) return;

    const value = quantityInput.value.trim();
    const quantity = Number(value);

    const valid =
      /^\d+$/.test(value) &&
      Number.isSafeInteger(quantity) &&
      quantity >= Number(selectedService.min) &&
      quantity <= Number(selectedService.max);

    quantityInput.setCustomValidity(
      valid
        ? ''
        : `Введите целое число от ${selectedService.min} до ${selectedService.max}.`
    );

    quantityInput.classList.toggle('invalid', !valid);
    submitButton.disabled = !valid;

    document.getElementById('modalTotalPrice').textContent =
      valid
        ? money(Number(selectedService.rate) * quantity / 1000)
        : '—';
  }

  function openOrderModal(serviceId) {
    selectedService = SERVICES.find(
      service => Number(service.service) === Number(serviceId)
    );

    if (!selectedService) return;

    document.getElementById('modalNetwork').textContent =
      selectedService.network;

    document.getElementById('modalCategory').textContent =
      selectedService.category;

    document.getElementById('modalService').textContent =
      selectedService.name;

    document.getElementById('modalDescription').textContent =
      selectedService.description || 'Описание не предоставлено.';

    document.getElementById('modalLimits').textContent =
      `Мин: ${number(selectedService.min)} | Макс: ${number(selectedService.max)}`;

    quantityInput.min = selectedService.min;
    quantityInput.max = selectedService.max;
    quantityInput.step = '1';
    quantityInput.value = selectedService.min;
    quantityInput.readOnly =
      Number(selectedService.min) === Number(selectedService.max);

    linkInput.value = '';
    linkInput.setCustomValidity('');

    updatePrice();

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    linkInput.focus();
  }

  function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
    selectedService = null;
  }

  async function submitOrder(event) {
    event.preventDefault();

    if (!selectedService) return;

    updatePrice();

    if (!form.reportValidity()) return;

    const initData = tg?.initData || '';

    if (!initData) {
      showToast(
        'Оформление заказа доступно только внутри Telegram Mini App.',
        true
      );
      return;
    }

    const quantity = Number(quantityInput.value);
    const total = Number(
      (Number(selectedService.rate) * quantity / 1000).toFixed(2)
    );

    const payload = {
      initData,
      order: {
        service: selectedService.service,
        name: selectedService.name,
        network: selectedService.network,
        category: selectedService.category,
        link: linkInput.value.trim(),
        quantity,
        total
      }
    };

    const oldText = submitButton.textContent;
    submitButton.disabled = true;
    submitButton.textContent = 'Отправка…';

    try {
      const response = await fetch(`${API_BASE}/api/order`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.error || 'Не удалось отправить заказ');
      }

      closeModal();
      showToast('Заявка отправлена администратору.');
    } catch (error) {
      showToast(error.message || 'Ошибка соединения с сервером.', true);
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = oldText;
      updatePrice();
    }
  }

  function resetToHome() {
    closeModal();
    renderNetworks();
  }

  quantityInput.addEventListener('input', updatePrice);

  modal.addEventListener('click', event => {
    if (event.target === modal) closeModal();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && modal.classList.contains('active')) {
      closeModal();
    }
  });

  window.openOrderModal = openOrderModal;
  window.closeModal = closeModal;
  window.submitOrder = submitOrder;
  window.resetToHome = resetToHome;

  renderNetworks();
})();
</script>

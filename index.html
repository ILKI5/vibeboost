<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VibeBoost</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg: #070b18;
  --panel: #11182b;
  --panel2: #18223b;
  --line: rgba(255,255,255,0.08);
  --text: #f4f3ff;
  --muted: #9ca8c5;
  --accent: #9b7cff;
  --cyan: #55d9ff;
  --green: #65e6a1;
  --red: #ff7185;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:15px/1.5 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
body{overflow-x:hidden;background:radial-gradient(circle at 15% 0%,#2d1b54 0,transparent 40%),radial-gradient(circle at 100% 10%,#113856 0,transparent 35%),var(--bg)}
body:before,body:after{content:"";position:fixed;z-index:-1;width:50vw;height:50vw;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;animation:float 12s ease-in-out infinite alternate}
body:before{background:#7655ff;top:5%;left:-10%}
body:after{background:#1bc7ec;right:-10%;bottom:5%;animation-delay:-6s}
@keyframes float{to{transform:translate(6vw,4vh) scale(1.15)}}

header{position:sticky;top:0;z-index:20;padding:12px 16px;background:rgba(8,13,27,0.85);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.header{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{border:0;background:none;color:#fff;font-size:24px;font-weight:900;letter-spacing:-0.5px;cursor:pointer;padding:0}
.logo span{color:var(--accent)}
.balance{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.balance small{color:var(--muted);font-size:11px}
.bal{font-weight:800;color:var(--green);white-space:nowrap;font-size:14px}
.plus{width:26px;height:26px;border:0;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--accent),#6040d8);font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 15px rgba(141,108,255,0.4);transition:transform .15s}
.plus:active{transform:scale(0.9)}

.wrap{max-width:1000px;margin:auto;padding:20px 16px 60px}
.hero{padding:6px 0 20px}
.eyebrow{display:inline-flex;padding:5px 10px;border:1px solid rgba(169,140,255,0.25);border-radius:999px;color:#c8bbff;background:rgba(155,124,255,0.08);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-1px;margin:12px 0 8px;font-weight:900}
.hero h1 span{background:linear-gradient(100deg,#fff,#a98cff 55%,#59dfff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14px}

.tools{display:flex;gap:10px;align-items:center;margin:16px 0 18px}
.search{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,0.04);color:var(--text);outline:0;font-size:14px;transition:border-color .2s}
.search:focus{border-color:rgba(155,124,255,0.6)}
.counter{color:var(--muted);font-size:12px;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:90px;padding:16px;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.01));box-shadow:0 8px 25px rgba(0,0,0,0.2);overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s}
.card:active{transform:scale(0.98)}
.icon{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,rgba(155,124,255,0.2),rgba(85,217,255,0.1));border:1px solid var(--line);color:#d5caff;font-weight:900}
.icon img{width:40px;height:40px;object-fit:contain}
.info{flex:1;min-width:0}
.title{display:block;font-weight:800;font-size:14px;overflow-wrap:anywhere}
.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.price{display:block;color:#c6b8ff;font-weight:800;margin-top:6px;font-size:13px}
.arrow{color:#8f9bb8;font-size:22px}

.back{border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;margin-bottom:12px;font-weight:600}
.footer{margin-top:35px;color:#74809e;font-size:12px;text-align:center}

.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,17,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal{width:100%;max-width:520px;max-height:90dvh;overflow:auto;padding:22px;border:1px solid rgba(255,255,255,0.12);border-radius:22px;background:linear-gradient(145deg,#151e35,#0d1425);box-shadow:0 25px 80px rgba(0,0,0,0.8)}
.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.modal h2{margin:0;font-size:20px;font-weight:800}
.close{border:0;background:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer}
.desc{max-height:140px;overflow:auto;white-space:pre-wrap;margin:12px 0;padding:12px;border-radius:12px;background:#050a16;color:var(--muted);font-size:13px}
.meta{color:var(--muted);font-size:12px;margin-top:3px}
label{display:block;margin:14px 0 6px;font-size:13px;color:#c6cce0;font-weight:600}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#080e1c;color:var(--text);outline:0;font-size:14px}
.field:focus{border-color:var(--accent)}
.total{display:flex;justify-content:space-between;margin:16px 0;padding:14px;border-radius:14px;background:linear-gradient(120deg,#34215e,#1a2d4d);font-size:15px;font-weight:700}
.status{white-space:pre-wrap;margin-top:12px;font-size:13px;line-height:1.4}
.primary{width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(110deg,#7957e8,#ae6dec);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(141,108,255,0.3);transition:transform .15s,filter .15s}
.primary:active{transform:scale(0.98)}
.primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.loading{display:inline-flex;align-items:center;gap:8px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:22px;z-index:300;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border:1px solid rgba(155,124,255,0.4);border-radius:12px;background:#17132b;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.6);font-size:13px;white-space:pre-wrap}

.splash{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#070b18;transition:opacity .35s,visibility .35s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splashbox{text-align:center}
.splashlogo{font-size:32px;font-weight:900;letter-spacing:-1px}
.splashlogo span{color:var(--accent)}
.loader{width:40px;height:40px;margin:18px auto;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-right-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
.splashtext{color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splashbox">
    <div class="splashlogo">Vibe<span>Boost</span></div>
    <div class="loader"></div>
    <div class="splashtext">Запуск приложения…</div>
  </div>
</div>

<header>
  <div class="header">
    <button class="logo" id="home">Vibe<span>Boost</span></button>
    <div class="balance">
      <small>Баланс</small>
      <span class="bal" id="balance">… ₽</span>
      <button class="plus" id="openTopup" aria-label="Пополнить">+</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Продвижение нового уровня</div>
    <h1>Выбирай.<br><span>Запускай результат.</span></h1>
    <p>Услуги для роста твоих социальных сетей — быстро, удобно и в одном месте.</p>
  </section>

  <button class="back" id="back" hidden>← Назад</button>
  
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Поиск услуги или площадки…">
    <span class="counter" id="counter"></span>
  </div>
  
  <div class="grid" id="grid"></div>
  <div class="footer">Безопасная оплата с баланса профиля</div>
</main>

<!-- Модалка заказа -->
<div class="overlay" id="orderOverlay" hidden>
  <section class="modal">
    <div class="modalhead">
      <h2>Оформление заказа</h2>
      <button class="close" id="closeOrder">×</button>
    </div>
    <strong id="serviceName" style="font-size:15px"></strong>
    <div class="meta" id="serviceMeta"></div>
    <div class="desc" id="description"></div>
    <form id="orderForm">
      <label for="link">Ссылка / username</label>
      <input class="field" id="link" required maxlength="700" placeholder="https://… или @username">
      <label for="quantity">Количество <span class="meta" id="limits"></span></label>
      <input class="field" id="quantity" type="number" step="1" required>
      <div class="total">
        <span>К оплате:</span>
        <strong id="total" style="color:#d5caff">—</strong>
      </div>
      <button class="primary" id="submit" type="submit">Подтвердить заказ</button>
      <div class="status" id="orderStatus"></div>
    </form>
  </section>
</div>

<!-- Модалка пополнения -->
<div class="overlay" id="topupOverlay" hidden>
  <section class="modal">
    <div class="modalhead">
      <h2>Пополнение баланса</h2>
      <button class="close" id="closeTopup">×</button>
    </div>
    <p class="meta" style="margin-top:0">Выбери сумму для пополнения счета:</p>
    <label for="topupAmount">Сумма, ₽</label>
    <input class="field" id="topupAmount" type="number" min="10" max="100000" value="100">
    <label for="topupMethod">Способ оплаты</label>
    <select class="field" id="topupMethod">
      <option value="sbp">СБП / Банковская карта РФ</option>
      <option value="crypto">Криптовалюта (USDT / TON)</option>
      <option value="other">Другой способ</option>
    </select>
    <button class="primary" id="createTopup" style="margin-top:16px">Создать запрос</button>
    <div class="status" id="topupStatus"></div>
  </section>
</div>

<div id="toast" hidden></div>

<script>
'use strict';
const API = 'https://vibeboost-2.onrender.com';
const ICONS = {
  'Telegram':'telegram.svg','ВКонтакте':'vk.svg','Instagram':'instagram.svg',
  'TikTok':'tiktok.svg','YouTube':'youtube.svg','Twitter X':'twitter.png',
  'Одноклассники':'ok.svg','RuTube':'rutube.png','Twitch':'twitch.svg',
  'Kick':'kick.png','MAX':'max.png','Wibes':'wibes.png'
};

const $ = id => document.getElementById(id);
const tg = window.Telegram?.WebApp;
let services=[], network=null, category=null, selected=null, balance=0, busy=false, toastTimer;

// Функция сокрытия splash-экрана
function hideSplash() {
  const s = $('splash');
  if (s && !s.classList.contains('hide')) {
    s.classList.add('hide');
  }
}

// Гарантированно скрываем splash через 1.5 секунды максимум
setTimeout(hideSplash, 1500);

const money = n => Number(n).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});

function toast(s) {
  const t = $('toast');
  t.textContent = s;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidden = true, 4500);
}

function el(t, x, c) {
  const e = document.createElement(t);
  if (x !== undefined) e.textContent = x;
  if (c) e.className = c;
  return e;
}

function auth() {
  if (tg?.initData && tg.initData.length > 0) return tg.initData;
  if (location.hash && location.hash.length > 1) {
    const p = new URLSearchParams(location.hash.slice(1));
    const h = p.get('tgWebAppData');
    if (h) return h;
  }
  return '';
}

async function api(path, payload) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const text = await r.text();
  let d;
  try { d = JSON.parse(text); } catch { throw Error('Сервер вернул ошибку: ' + text.slice(0, 200)); }
  if (!r.ok || !d.ok) throw Error(d.error || ('HTTP ' + r.status));
  return d;
}

// Фоновая загрузка баланса (не блокирует показ каталога!)
async function refreshBalance() {
  const cached = localStorage.getItem('vb_bal');
  if (cached !== null) {
    balance = Number(cached);
    $('balance').textContent = money(balance) + ' ₽';
  }
  const a = auth();
  if (!a) {
    if (cached === null) $('balance').textContent = '0,00 ₽';
    return;
  }
  try {
    const d = await api('/api/user/info', { initData: a });
    balance = Number(d.balance || 0);
    $('balance').textContent = money(balance) + ' ₽';
    localStorage.setItem('vb_bal', String(balance));
  } catch (e) {
    if (cached === null) $('balance').textContent = '0,00 ₽';
    console.error('Баланс:', e);
  }
}

function card(title, sub, cb, net, price) {
  const b = el('button', undefined, 'card');
  b.type = 'button';
  if (net) {
    const i = el('span', net.slice(0,2).toUpperCase(), 'icon');
    const f = ICONS[net];
    if (f) {
      const im = new Image();
      im.alt = '';
      im.onload = () => i.replaceChildren(im);
      im.src = './' + f;
    }
    b.append(i);
  }
  const info = el('span', undefined, 'info');
  info.append(el('span', title, 'title'), el('span', sub, 'sub'));
  if (price) info.append(el('span', price, 'price'));
  b.append(info, el('span', '›', 'arrow'));
  b.onclick = cb;
  return b;
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const g = $('grid');
  g.replaceChildren();
  $('back').hidden = !network;

  if (!network) {
    const nets = [...new Set(services.map(s => s.network))].sort((a,b) => a.localeCompare(b,'ru'));
    for (const n of nets.filter(n => n.toLowerCase().includes(q))) {
      const count = services.filter(s => s.network === n).length;
      g.append(card(n, 'Доступно услуг: ' + count, () => {
        network = n; category = null; $('search').value = ''; render();
      }, n));
    }
  } else if (!category) {
    const filtered = services.filter(s => s.network === network);
    const cats = [...new Set(filtered.map(s => s.category))].sort((a,b) => a.localeCompare(b,'ru'));
    for (const c of cats.filter(x => x.toLowerCase().includes(q))) {
      const count = filtered.filter(s => s.category === c).length;
      g.append(card(c, 'Доступно услуг: ' + count, () => {
        category = c; $('search').value = ''; render();
      }));
    }
  } else {
    for (const s of services.filter(s => s.network === network && s.category === category && (s.name + ' ' + s.service).toLowerCase().includes(q))) {
      g.append(card(s.name, 'ID ' + s.service + ' · ' + s.min + '–' + s.max, () => openOrder(s), null, money(Number(s.rate)) + ' ₽ / 1000'));
    }
  }
  $('counter').textContent = 'Показано: ' + g.children.length;
  if (!g.children.length) g.append(el('p', 'Ничего не найдено', 'empty'));
}

function openOrder(s) {
  selected = s;
  $('serviceName').textContent = s.name;
  $('serviceMeta').textContent = s.network + ' · ' + s.category + ' · ID ' + s.service;
  $('description').textContent = s.description || 'Описание не предоставлено';
  $('link').value = '';
  $('quantity').min = s.min;
  $('quantity').max = s.max;
  $('quantity').value = s.min;
  $('limits').textContent = '(' + s.min + '–' + s.max + ')';
  $('orderStatus').textContent = '';
  const subBtn = $('submit');
  subBtn.disabled = false;
  subBtn.textContent = 'Подтвердить заказ';
  price();
  $('orderOverlay').hidden = false;
}

function price() {
  if (!selected) return;
  const raw = $('quantity').value;
  const q = Number(raw);
  const isValid = /^\d+$/.test(raw) && Number.isSafeInteger(q) && q >= Number(selected.min) && q <= Number(selected.max);
  $('quantity').setCustomValidity(isValid ? '' : ('Количество от ' + selected.min + ' до ' + selected.max));
  $('total').textContent = isValid ? (money(Number(selected.rate) * q / 1000) + ' ₽') : '—';
}

// Оформление заказа с блокировкой от повторных нажатий
$('orderForm').onsubmit = async e => {
  e.preventDefault();
  if (busy || !selected) return;
  price();
  if (!e.currentTarget.reportValidity()) return;

  const a = auth();
  if (!a) {
    $('orderStatus').textContent = 'Открой Mini App через Telegram.';
    return;
  }

  busy = true;
  const b = $('submit');
  b.disabled = true;
  b.innerHTML = '<span class="loading"><i class="spin"></i>Оформляем заказ…</span>';
  $('orderStatus').textContent = 'Проверяем баланс и создаем заказ. Пожалуйста, подождите…';

  try {
    const d = await api('/api/order', {
      initData: a,
      order: {
        service: selected.service,
        quantity: Number($('quantity').value),
        link: $('link').value.trim()
      }
    });

    balance = Number(d.new_balance);
    $('balance').textContent = money(balance) + ' ₽';
    localStorage.setItem('vb_bal', String(balance));
    $('orderStatus').textContent = '✅ Заказ успешно оформлен!';
    toast('✅ Заказ оформлен!');
    b.textContent = 'Заказ оформлен';
    setTimeout(() => { $('orderOverlay').hidden = true; }, 2000);
  } catch (err) {
    $('orderStatus').textContent = '❌ ' + err.message;
    b.disabled = false;
    b.textContent = 'Повторить заказ';
  } finally {
    busy = false;
  }
};

$('quantity').oninput = price;
$('closeOrder').onclick = () => { if (!busy) $('orderOverlay').hidden = true; };
$('openTopup').onclick = () => { $('topupOverlay').hidden = false; };
$('closeTopup').onclick = () => { $('topupOverlay').hidden = true; };

$('createTopup').onclick = async () => {
  const b = $('createTopup');
  b.disabled = true;
  b.innerHTML = '<span class="loading"><i class="spin"></i>Отправляем…</span>';
  try {
    const d = await api('/api/topup', {
      initData: auth(),
      amount: Number($('topupAmount').value),
      method: $('topupMethod').value
    });
    $('topupStatus').textContent = '✅ ' + d.message;
    toast('Запрос отправлен администратору');
  } catch (e) {
    $('topupStatus').textContent = '❌ ' + e.message;
  } finally {
    b.disabled = false;
    b.textContent = 'Создать запрос';
  }
};

$('search').oninput = render;
$('home').onclick = () => { network = null; category = null; $('search').value = ''; render(); };
$('back').onclick = () => { if (category) category = null; else network = null; $('search').value = ''; render(); };

tg?.ready();
tg?.expand();

// Загрузка каталога и параллельный запрос баланса
(async () => {
  try {
    const r = await fetch('./services.json?v=' + Date.now());
    if (!r.ok) throw Error('Каталог недоступен');
    services = await r.json();
    if (!Array.isArray(services) || !services.length) throw Error('Каталог пуст');
    services = services.map(s => ({
      ...s,
      network: String(s.network || 'Без сети'),
      category: String(s.category || 'Прочее'),
      name: String(s.name || 'Услуга')
    }));
    render();
  } catch (e) {
    $('grid').append(el('p', e.message, 'empty'));
    toast(e.message);
  } finally {
    hideSplash();
    refreshBalance();
  }
})();
</script>
</body>
</html>

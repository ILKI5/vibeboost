<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VibeBoost</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#151e33;--line:#303c59;--text:#eef0ff;--muted:#a5afcb;--accent:#a18aff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#302151,var(--bg) 65%);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}header{border-bottom:1px solid var(--line);background:#0a1020dd;padding:16px}.header{max-width:964px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{background:none;border:0;color:#b8a6ff;font-size:25px;font-weight:800;padding:0}.balance{display:flex;align-items:center;gap:8px;background:var(--panel);padding:7px 11px;border:1px solid var(--line);border-radius:99px}.bal{color:#79f2ab;font-weight:700}.plus{width:28px;height:28px;border:0;border-radius:50%;background:var(--accent);color:white;font-weight:bold;font-size:20px}.wrap{max-width:1000px;margin:auto;padding:24px 18px}.muted{color:var(--muted);font-size:13px}h1{font-size:25px;margin:10px 0 20px}.tools{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}input{width:100%;background:#0c1426;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}input:focus{outline:2px solid var(--accent)}#search{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;min-height:90px;min-width:0}.card-info{flex:1;min-width:0}.title{display:block;font-weight:700;overflow-wrap:anywhere}.subtitle{display:block;color:var(--muted);font-size:13px;margin-top:5px}.icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:#292642;color:#cfbdff;font-weight:bold}.icon img{width:48px;height:48px;object-fit:contain}.price{display:block;color:#c3afff;margin-top:8px;font-weight:700}.button{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:var(--panel);color:inherit}.primary{background:linear-gradient(110deg,#7857df,#a462df);border:0;font-weight:700;color:white}.back{margin-bottom:16px}.empty{color:var(--muted);padding:20px}.overlay{position:fixed;inset:0;background:#030713dd;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:#121b2f;border:1px solid var(--line);border-radius:22px;padding:24px}.modal-head{display:flex;align-items:start;gap:12px;justify-content:space-between}.modal h2{font-size:22px;margin:0 0 15px}.desc{white-space:pre-wrap;overflow-wrap:anywhere;max-height:170px;overflow:auto;background:#0c1426;padding:12px;border-radius:12px;font-size:13px;color:var(--muted);margin:14px 0}label{display:block;margin:16px 0 6px}.total{display:flex;justify-content:space-between;gap:10px;background:#352753;border-radius:12px;padding:16px;margin:20px 0}#submit{width:100%}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:92vw;padding:14px 20px;background:#302549;color:white;border:1px solid #705d99;border-radius:12px;z-index:200;white-space:pre-wrap}[hidden]{display:none!important}footer{color:var(--muted);font-size:12px;margin-top:30px}.status{white-space:pre-wrap;margin-top:12px;font-size:13px}
</style></head><body>
<header><div class="header"><button class="logo" id="home">VibeBoost</button><div class="balance"><span class="muted">Баланс</span><span class="bal" id="balance">… ₽</span><button class="plus" id="openTopup" aria-label="Пополнить">+</button></div></div></header>
<main class="wrap"><button class="button back" id="back" hidden>← Назад</button><h1 id="heading">Загружаем каталог…</h1><div class="tools"><input id="search" type="search" placeholder="Поиск…"><span class="muted" id="counter"></span></div><div class="grid" id="grid"></div><footer>Заказы отправляются поставщику после проверки и списания баланса. Пополнение подтверждает администратор.</footer></main>
<div class="overlay" id="orderOverlay" hidden><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Покупка</h2><button class="button" id="closeOrder">×</button></div><strong id="serviceName"></strong><div class="muted" id="serviceMeta"></div><div class="desc" id="description"></div><form id="orderForm"><label for="link">Ссылка / username</label><input id="link" required maxlength="700"><label for="quantity">Количество <span class="muted" id="limits"></span></label><input id="quantity" type="number" step="1" required><div class="total"><span>К оплате</span><strong id="total">—</strong></div><button class="button primary" id="submit">Купить</button><div class="status" id="orderStatus"></div></form></section></div>
<div class="overlay" id="topupOverlay" hidden><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Пополнение баланса</h2><button class="button" id="closeTopup">×</button></div><p class="muted">Выбери сумму. Это создаст запрос администратору; средства будут зачислены после проверки оплаты.</p><label for="topupAmount">Сумма, ₽ (от 10 до 100000)</label><input id="topupAmount" type="number" min="10" max="100000" value="100"><label for="topupMethod">Способ</label><select id="topupMethod" style="width:100%;padding:12px;background:#0c1426;color:white;border:1px solid var(--line);border-radius:12px"><option value="sbp">СБП / карта</option><option value="crypto">Криптовалюта</option><option value="other">Другой способ</option></select><button class="button primary" id="createTopup" style="width:100%;margin-top:16px">Запросить пополнение</button><div class="status" id="topupStatus"></div></section></div><div id="toast" hidden></div>
<script>
'use strict';
const API='https://vibeboost-2.onrender.com';
const ICONS={'Telegram':'telegram.svg','ВКонтакте':'vk.svg','Instagram':'instagram.svg','TikTok':'tiktok.svg','YouTube':'youtube.svg','Twitter X':'twitter.png','Одноклассники':'ok.svg','RuTube':'rutube.png','Twitch':'twitch.svg','Kick':'kick.png','MAX':'max.png','Wibes':'wibes.png'};
const $=id=>document.getElementById(id), tg=window.Telegram?.WebApp;
let services=[], network=null, category=null, selected=null, balance=0, busy=false, toastTimer;
const money=n=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
async function api(path,payload){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function auth(){return tg?.initData||''}
async function refreshBalance(){if(!auth()){$('balance').textContent='Открой в Telegram';return}try{const d=await api('/api/user/info',{initData:auth()});balance=Number(d.balance||0);$('balance').textContent=money(balance)}catch(e){$('balance').textContent='Ошибка';console.error(e)}}
function card(title,sub,cb,net,price){const b=el('button',undefined,'card');b.type='button';if(net){const i=el('span',net.slice(0,2).toUpperCase(),'icon'),file=ICONS[net];if(file){const im=new Image();im.alt='';im.onload=()=>i.replaceChildren(im);im.src='./'+file}b.append(i)}const info=el('span',undefined,'card-info');info.append(el('span',title,'title'),el('span',sub,'subtitle'));if(price)info.append(el('span',price,'price'));b.append(info,el('span','›'));b.onclick=cb;return b}
function render(){$('back').hidden=!network;$('heading').textContent=!network?'Выберите соцсеть':(category||network+': категории');const q=$('search').value.trim().toLowerCase(),g=$('grid');g.replaceChildren();if(!network){for(const n of [...new Set(services.map(s=>s.network))].sort((a,b)=>a.localeCompare(b,'ru')).filter(n=>n.toLowerCase().includes(q))){const a=services.filter(s=>s.network===n);g.append(card(n,`Услуг: ${a.length}`,()=>{network=n;category=null;$('search').value='';render()},n))}}else if(!category){const a=services.filter(s=>s.network===network),cats=[...new Set(a.map(s=>s.category))].sort((x,y)=>x.localeCompare(y,'ru'));for(const c of cats.filter(x=>x.toLowerCase().includes(q)))g.append(card(c,`Услуг: ${a.filter(s=>s.category===c).length}`,()=>{category=c;$('search').value='';render()}))}else{for(const s of services.filter(s=>s.network===network&&s.category===category&&(s.name+' '+s.service).toLowerCase().includes(q)))g.append(card(s.name,`ID ${s.service} · ${s.min}–${s.max}`,()=>openOrder(s),null,money(s.rate)+' / 1000'))}const count=g.children.length;$('counter').textContent=`Показано: ${count}`;if(!count)g.append(el('p','Ничего не найдено','empty'))}
function openOrder(s){selected=s;$('serviceName').textContent=s.name;$('serviceMeta').textContent=`${s.network} · ${s.category} · ID ${s.service}`;$('description').textContent=s.description||'Описание не предоставлено';$('link').value='';$('quantity').min=s.min;$('quantity').max=s.max;$('quantity').value=s.min;$('limits').textContent=`(${s.min}–${s.max})`;$('orderStatus').textContent='';price();$('orderOverlay').hidden=false}
function price(){if(!selected)return;const q=Number($('quantity').value),valid=/^\d+$/.test($('quantity').value)&&Number.isSafeInteger(q)&&q>=Number(selected.min)&&q<=Number(selected.max);$('quantity').setCustomValidity(valid?'':`Количество от ${selected.min} до ${selected.max}`);$('total').textContent=valid?money(Number(selected.rate)*q/1000):'—'}
$('orderForm').onsubmit=async e=>{e.preventDefault();if(busy||!selected)return;price();if(!e.currentTarget.reportValidity())return;if(!auth()){ $('orderStatus').textContent='Открой Mini App через Telegram.';return}busy=true;$('submit').disabled=true;$('orderStatus').textContent='Проверяем баланс и отправляем заказ…';try{const d=await api('/api/order',{initData:auth(),order:{service:selected.service,quantity:Number($('quantity').value),link:$('link').value.trim()}});balance=Number(d.new_balance);$('balance').textContent=money(balance);$('orderStatus').textContent=`Заказ принят поставщиком. ID: ${d.provider_id}. Остаток: ${money(balance)}`;toast('Заказ оформлен');setTimeout(()=>{$('orderOverlay').hidden=true},2500)}catch(err){$('orderStatus').textContent='Ошибка: '+err.message}finally{busy=false;$('submit').disabled=false}};
$('quantity').oninput=price;$('closeOrder').onclick=()=>$('orderOverlay').hidden=true;$('openTopup').onclick=()=>$('topupOverlay').hidden=false;$('closeTopup').onclick=()=>$('topupOverlay').hidden=true;
$('createTopup').onclick=async()=>{try{if(!auth())throw Error('Открой Mini App через Telegram');const d=await api('/api/topup',{initData:auth(),amount:Number($('topupAmount').value),method:$('topupMethod').value});$('topupStatus').textContent=d.message;toast('Запрос отправлен администратору')}catch(e){$('topupStatus').textContent='Ошибка: '+e.message}};
$('search').oninput=render;$('home').onclick=()=>{network=null;category=null;$('search').value='';render()};$('back').onclick=()=>{if(category)category=null;else network=null;$('search').value='';render()};
tg?.ready();tg?.expand();refreshBalance();
(async()=>{try{const r=await fetch('./services.json?v='+Date.now());if(!r.ok)throw Error('services.json HTTP '+r.status);const d=await r.json();if(!Array.isArray(d)||!d.length)throw Error('services.json не массив или пуст');services=d.map(s=>({...s,network:String(s.network||'Без сети'),category:String(s.category||'Прочее'),name:String(s.name||'Услуга')}));render()}catch(e){$('heading').textContent='Ошибка загрузки каталога';$('grid').append(el('p',e.message,'empty'))}})();
</script></body></html>
